components:
  schemas:
    AiUsageMetrics:
      properties:
        calls:
          type: integer
          title: Calls
          default: 0
        input_tokens:
          type: integer
          title: Input Tokens
          default: 0
        output_tokens:
          type: integer
          title: Output Tokens
          default: 0
        total_tokens:
          type: integer
          title: Total Tokens
          default: 0
      type: object
      title: AiUsageMetrics
    Body_parse_cv_cv_parser_parse_post:
      properties:
        file:
          anyOf:
          - items:
              type: string
              contentMediaType: application/octet-stream
            type: array
          - type: 'null'
          title: File
      type: object
      title: Body_parse_cv_cv_parser_parse_post
    CandidateCreate:
      properties:
        name:
          type: string
          minLength: 2
          title: Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          default: new
      type: object
      required:
      - name
      title: CandidateCreate
    CandidatePrivacyRequest:
      properties:
        candidate_id:
          type: string
          minLength: 1
          title: Candidate Id
      type: object
      required:
      - candidate_id
      title: CandidatePrivacyRequest
    CandidatePrivacyResponse:
      properties:
        candidate_id:
          type: string
          title: Candidate Id
        mode:
          type: string
          enum:
          - anon
          - deanon
          title: Mode
        text:
          type: string
          title: Text
        original_text:
          type: string
          title: Original Text
        anonymized_text:
          type: string
          title: Anonymized Text
        mapping:
          additionalProperties:
            type: string
          type: object
          title: Mapping
      type: object
      required:
      - candidate_id
      - mode
      - text
      - original_text
      - anonymized_text
      title: CandidatePrivacyResponse
    CandidateProfileExtraction:
      properties:
        name:
          type: string
          title: Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        experience_years:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Experience Years
        salary_expectation:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Salary Expectation
        experience:
          anyOf:
          - type: string
          - type: 'null'
          title: Experience
        education:
          anyOf:
          - type: string
          - type: 'null'
          title: Education
        certificates:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificates
        drivers_license:
          anyOf:
          - type: string
          - type: 'null'
          title: Drivers License
        mobility:
          anyOf:
          - type: string
          - type: 'null'
          title: Mobility
        desired_salary:
          anyOf:
          - type: string
          - type: 'null'
          title: Desired Salary
        availability:
          anyOf:
          - type: string
          - type: 'null'
          title: Availability
        notice_period:
          anyOf:
          - type: string
          - type: 'null'
          title: Notice Period
        linkedin_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Linkedin Url
        xing_url:
          anyOf:
