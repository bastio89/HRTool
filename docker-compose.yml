services:
  backend:
    build:
      context: ./backend
    container_name: hrtool-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
    volumes:
      - hrtool-data:/app/data
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    container_name: hrtool-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - hrtool-neo4j-data:/data
      - hrtool-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:7474/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: hrtool-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  graphrag:
    build:
      context: ./graphrag
    container_name: hrtool-graphrag
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.6:35b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
      OLLAMA_ENABLE_REASONING: ${OLLAMA_ENABLE_REASONING:-true}
      ENABLE_PARSE_LATENCY_AGGREGATION: ${ENABLE_PARSE_LATENCY_AGGREGATION:-false}
      PARSE_LATENCY_WINDOW_SIZE: ${PARSE_LATENCY_WINDOW_SIZE:-200}
      PARSE_LATENCY_LOG_EVERY: ${PARSE_LATENCY_LOG_EVERY:-20}
    ports:
      - "${GRAPHRAG_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  hrtool-data:
  hrtool-neo4j-data:
  hrtool-neo4j-logs:
