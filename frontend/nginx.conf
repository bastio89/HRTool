server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;

  # Re-resolve upstream hostnames periodically instead of caching a stale container IP.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location /graphrag-api/ {
    set $graphrag_upstream http://graphrag:8000;
    rewrite ^/graphrag-api/(.*)$ /$1 break;
    proxy_pass $graphrag_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
