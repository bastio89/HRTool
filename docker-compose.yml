services:
  postgres:
    image: postgres:16-alpine
    container_name: hrtool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrtool}
      POSTGRES_USER: ${POSTGRES_USER:-hrtool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrtoolpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrtool} -d ${POSTGRES_DB:-hrtool}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hrtool-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hrtool:hrtoolpass@postgres:5432/hrtool}
    volumes:
      - hrtool-data:/app/data
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend_new:
    build:
      context: .
      dockerfile: ./backend_new/Dockerfile
    container_name: hrtool-backend-new
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_NEW_HOST: 0.0.0.0
      BACKEND_NEW_PORT: 8001
      DATABASE_URL: ${DATABASE_URL:-postgresql://hrtool:hrtoolpass@postgres:5432/hrtool}
      BACKEND_NEW_JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      BACKEND_NEW_CORS_ORIGINS: ${BACKEND_NEW_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_NEW_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health').read()\"" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrtool-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  frontend:
    build:
      context: ./frontend
    container_name: hrtool-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  hrtool-data:
  postgres-data:
  pgadmin-data:
