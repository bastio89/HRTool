name: CI

on:
  push:
    paths:
      - backend/**
      - frontend/**
      - graphrag/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - graphrag/**
      - .github/workflows/backend-tests.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # src/database.js opens the connection at import time, so every test that
    # pulls in a route needs a reachable database just to load.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrtool
          POSTGRES_PASSWORD: hrtool
          POSTGRES_DB: hrtool_test
          # Der synchrone Verbindungsaufbau in src/postgresDatabase.js (deasync)
          # blockiert den Event-Loop, solange Postgres einen Passwort-Handshake
          # verlangt: die Verbindung steht, bis Postgres nach 60 s abbricht
          # ("canceling authentication due to timeout"). Reproduziert mit md5
          # und mit scram-sha-256; nur trust funktioniert. Fuer eine
          # Wegwerf-Testdatenbank ist trust vertretbar - der Fehler selbst
          # bleibt offen und gehoert behoben, siehe Produktionsreife-Liste.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrtool -d hrtool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hrtool:hrtool@localhost:5432/hrtool_test
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build first: it used to sit behind the tests and was skipped on every
      # red run, so a broken build could reach master unnoticed.
      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  graphrag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphrag

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrtool
          POSTGRES_PASSWORD: hrtool
          POSTGRES_DB: hrtool_test
          # Der synchrone Verbindungsaufbau in src/postgresDatabase.js (deasync)
          # blockiert den Event-Loop, solange Postgres einen Passwort-Handshake
          # verlangt: die Verbindung steht, bis Postgres nach 60 s abbricht
          # ("canceling authentication due to timeout"). Reproduziert mit md5
          # und mit scram-sha-256; nur trust funktioniert. Fuer eine
          # Wegwerf-Testdatenbank ist trust vertretbar - der Fehler selbst
          # bleibt offen und gehoert behoben, siehe Produktionsreife-Liste.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrtool -d hrtool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hrtool:hrtool@localhost:5432/hrtool_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: graphrag/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run GraphRAG tests
        run: pytest
